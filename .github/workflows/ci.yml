name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pipeline (rebuild artifacts from registry)
        run: npm run pipeline
      - name: Unit tests (stats, calibration, narrator, receipts)
        run: npm test
      - name: Build (Next.js production)
        run: npm run build
